<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷雾侦探 - AI 互动探案游戏</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Loading screen */
    #loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .loading-logo {
      font-size: 48px;
      font-family: var(--font-main);
      background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold), var(--accent-gold-dim));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border-color);
      border-top: 3px solid var(--accent-gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-logo">迷雾侦探</div>
    <div class="loading-spinner"></div>
  </div>
  <div id="game-screen"></div>
  <script src="js/caseGenerator.js"></script>
  <script src="js/monetization.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // Hide loading screen once everything is ready
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('hidden');
      }, 600);
    });
  </script>
</body>
</html>
